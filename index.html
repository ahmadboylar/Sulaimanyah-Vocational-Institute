<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sulaimanyah Vocational Institute | پەیمانگەی پیشەیی سلێمانی</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--gold:#C5A059;--bg:#070B12}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:#f1f5f9}
.gold-text{background:linear-gradient(135deg,#FDE047,#C5A059 55%,#9A7B38);-webkit-background-clip:text;color:transparent}
.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-5px)}
.photo{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.hero-bg{background:radial-gradient(600px 300px at 50% 0,rgba(197,160,89,.18),transparent),var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.pop{animation:pop .2s ease-out}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:70;background:linear-gradient(90deg,#FDE047,#C5A059)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes iconPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(197,160,89,0))}50%{transform:scale(1.08);filter:drop-shadow(0 0 9px rgba(197,160,89,.35))}}
.card .photo{transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s ease}
.card:hover .photo{transform:scale(1.07) rotate(1deg);filter:saturate(1.12) brightness(1.05)}
#students>div>h2 i{animation:iconPulse 3s ease-in-out infinite}

.orb{position:absolute;border-radius:9999px;filter:blur(70px);animation:floaty 7s ease-in-out infinite;pointer-events:none}
#home>*:not(canvas):not(.orb){position:relative;z-index:1}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(180deg)}.chev{transition:transform .25s}
#toast{transition:opacity .3s,transform .3s}
.sec-t{font-weight:900;font-size:clamp(1.6rem,3.5vw,2.4rem)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* extra playful news motion */
.news-card{animation:newsIn .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:center bottom}
.news-card:hover .news-icon{animation:newsWiggle .65s ease both}
